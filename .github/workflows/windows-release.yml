name: Windows desktop release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-desktop.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate release tag against VERSION
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python desktop/release_tools.py --check-tag $env:RELEASE_TAG --allow-prerelease
      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m venv .venv-desktop
          .venv-desktop/Scripts/python.exe -m pip install -r requirements-desktop.lock
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          .venv-desktop/Scripts/python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency conflicts' }
      - name: Syntax checks and existing test suite
        shell: pwsh
        run: |
          .venv-desktop/Scripts/python.exe -m compileall -q app.py desktop desktop_releases.py
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax check failed' }
          foreach ($file in (Get-ChildItem static/js -Filter *.js)) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $file" }
          }
          .venv-desktop/Scripts/python.exe -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
      - name: Import optional signing certificate
        id: certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CERTIFICATE_BASE64) {
            if ($env:CERTIFICATE_PASSWORD) { throw 'Certificate secret is missing' }
            Write-Host 'Building without code signing; GitHub HTTPS and SHA-256 remain required.'
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'manticore-code-signing.pfx'
          "pfx_path=$certificatePath" >> $env:GITHUB_OUTPUT
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificates = @(Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
          $certificate = $certificates | Where-Object HasPrivateKey | Select-Object -First 1
          if (-not $certificate) { throw 'Signing private key missing from PFX' }
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: Build Windows application and installer
        shell: pwsh
        env:
          CERTIFICATE_THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: ./build_windows_desktop.ps1 -SkipDependencies -CertificateThumbprint $env:CERTIFICATE_THUMBPRINT
      - name: Verify optional signature
        if: steps.certificate.outputs.thumbprint != ''
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          foreach ($path in @('dist/Manticore.exe', "dist/installer/Manticore-Setup-$version.exe")) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            Write-Host "$path - Authenticode status: $($signature.Status); $($signature.StatusMessage)"
          }
          .venv-desktop/Scripts/python.exe desktop/release_tools.py --verify-signatures
          if ($LASTEXITCODE -ne 0) { throw 'Publisher pin or WinVerifyTrust verification failed' }
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/installer/Manticore-Setup-*.exe
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installer/*
          if-no-files-found: error
      - name: Stage and verify release, then publish to its channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: UnicornisIT/manticore
        run: |
          $tag = $env:RELEASE_TAG
          $metadata = Get-Content dist/installer/desktop-update.json -Raw | ConvertFrom-Json
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'Refusing to replace a published release; increment VERSION.' }
          } else {
            gh release create $tag --draft --verify-tag --generate-notes --title $tag
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release draft' }
          }
          gh release upload $tag "dist/installer/$($metadata.asset)" dist/installer/desktop-update.json dist/installer/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          $raw = gh api "repos/$env:GH_REPO/releases/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Release verification failed' }
          $release = $raw | ConvertFrom-Json
          if (@($release.assets | Where-Object { $_.name -like '*.exe' }).Count -ne 1) { throw 'Draft must contain exactly one installer EXE' }
          if (@($release.assets | Where-Object { $_.name -in @('desktop-update.json', 'SHA256SUMS.txt') }).Count -ne 2) { throw 'Release metadata assets are missing' }
          $installer = @($release.assets | Where-Object name -eq $metadata.asset)
          if ($installer.Count -ne 1 -or $installer[0].size -ne $metadata.size -or $installer[0].digest -ne "sha256:$($metadata.sha256)") { throw 'Uploaded installer does not match local metadata' }
          if ($metadata.version.Contains('-')) {
            gh release edit $tag --draft=false --prerelease --latest=false
          } else {
            gh release edit $tag --draft=false --prerelease=false --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing release failed' }
      - name: Remove signing material
        if: always()
        shell: pwsh
        env:
          CERTIFICATE_PATH: ${{ steps.certificate.outputs.pfx_path }}
          CERTIFICATE_THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: |
          if ($env:CERTIFICATE_PATH -and (Test-Path -LiteralPath $env:CERTIFICATE_PATH)) { Remove-Item -LiteralPath $env:CERTIFICATE_PATH -Force }
          if ($env:CERTIFICATE_THUMBPRINT -match '^[0-9A-Fa-f]{40}$') {
            $certificateItem = "Cert:\CurrentUser\My\$env:CERTIFICATE_THUMBPRINT"
            if (Test-Path -LiteralPath $certificateItem) { Remove-Item -LiteralPath $certificateItem -Force }
          }
