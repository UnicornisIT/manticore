name: Windows desktop release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-sign-release:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-desktop.txt

      - name: Verify tag matches VERSION
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim().TrimStart('v', 'V')
          $tag = '${{ github.ref_name }}'
          $escapedVersion = [Regex]::Escape($version)
          if ($tag -ne "v$version" -and $tag -notmatch "^v$escapedVersion-rebuild(?:\.\d+)?$") {
            throw "Tag ${{ github.ref_name }} does not match VERSION ($version)."
          }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Import code-signing certificate
        id: certificate
        shell: powershell
        timeout-minutes: 2
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_BASE64 -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw 'Configure WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD repository secrets.'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'manticore-code-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          "pfx_path=$certificatePath" >> $env:GITHUB_OUTPUT
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $importedCertificates = @(Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
          $certificate = $importedCertificates | Where-Object { $_.HasPrivateKey } | Select-Object -First 1
          if (-not $certificate) {
            throw 'The PFX does not contain an importable certificate with a private key.'
          }
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          Write-Host "Imported code-signing certificate $($certificate.Thumbprint)."

          if ($certificate.Subject -eq $certificate.Issuer) {
            $publicCertificatePath = Join-Path $env:RUNNER_TEMP 'manticore-code-signing.cer'
            Export-Certificate -Cert $certificate -FilePath $publicCertificatePath | Out-Null
            "cer_path=$publicCertificatePath" >> $env:GITHUB_OUTPUT
            Write-Host 'Trusting the self-signed certificate for this runner job.'
            & certutil.exe -f -addstore Root $publicCertificatePath
            if ($LASTEXITCODE -ne 0) {
              throw 'Could not add the self-signed certificate to the local-machine Root store.'
            }
            & certutil.exe -f -addstore TrustedPublisher $publicCertificatePath
            if ($LASTEXITCODE -ne 0) {
              throw 'Could not add the self-signed certificate to the local-machine TrustedPublisher store.'
            }
            Write-Host 'The self-signed certificate is trusted for this runner job.'
          }

      - name: Build and sign Windows installer
        shell: powershell
        run: .\build_windows_desktop.ps1 -CertificateThumbprint '${{ steps.certificate.outputs.thumbprint }}'

      - name: Verify Authenticode signature
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim().TrimStart('v', 'V')
          $installer = "dist\installer\Manticore-Setup-$version.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid') {
            throw "Installer signature is not valid: $($signature.StatusMessage)"
          }

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/installer/Manticore-Setup-*.exe

      - name: Publish GitHub Release asset
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem 'dist\installer\Manticore-Setup-*.exe' | Select-Object -ExpandProperty FullName -First 1
          if (-not $installer) {
            throw 'The Windows installer was not found.'
          }
          gh release create '${{ github.ref_name }}' $installer --verify-tag --generate-notes --title '${{ github.ref_name }}'

      - name: Remove certificate material
        if: always()
        shell: powershell
        env:
          CERTIFICATE_PATH: ${{ steps.certificate.outputs.pfx_path }}
          PUBLIC_CERTIFICATE_PATH: ${{ steps.certificate.outputs.cer_path }}
          CERTIFICATE_THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: |
          foreach ($path in @($env:CERTIFICATE_PATH, $env:PUBLIC_CERTIFICATE_PATH)) {
            if ($path -and (Test-Path -LiteralPath $path)) {
              Remove-Item -LiteralPath $path -Force
            }
          }

          if ($env:CERTIFICATE_THUMBPRINT -match '^[0-9A-Fa-f]{40}$') {
            foreach ($store in @('Cert:\CurrentUser\My', 'Cert:\LocalMachine\Root', 'Cert:\LocalMachine\TrustedPublisher')) {
              $certificateItem = Join-Path $store $env:CERTIFICATE_THUMBPRINT
              if (Test-Path -LiteralPath $certificateItem) {
                Remove-Item -LiteralPath $certificateItem -Force
              }
            }
          }
