name: Windows desktop release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and publish (reuse only a draft)
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: windows-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-desktop.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate release tag against VERSION
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: python desktop/release_tools.py --check-tag $env:RELEASE_TAG --allow-prerelease
      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m venv .venv-desktop
          .venv-desktop/Scripts/python.exe -m pip install -r requirements-desktop.lock
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          .venv-desktop/Scripts/python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency conflicts' }
      - name: Syntax checks and existing test suite
        shell: pwsh
        run: |
          .venv-desktop/Scripts/python.exe -m compileall -q app.py desktop desktop_releases.py
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax check failed' }
          foreach ($file in (Get-ChildItem static/js -Filter *.js)) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $file" }
          }
          .venv-desktop/Scripts/python.exe -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
      - name: Import optional signing certificate
        id: certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CERTIFICATE_BASE64) {
            if ($env:CERTIFICATE_PASSWORD) { throw 'Certificate secret is missing' }
            Write-Host 'Building without code signing; GitHub HTTPS and SHA-256 remain required.'
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'manticore-code-signing.pfx'
          "pfx_path=$certificatePath" >> $env:GITHUB_OUTPUT
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificates = @(Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
          $certificate = $certificates | Where-Object HasPrivateKey | Select-Object -First 1
          if (-not $certificate) { throw 'Signing private key missing from PFX' }
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: Build Windows application and installer
        shell: pwsh
        env:
          CERTIFICATE_THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: ./build_windows_desktop.ps1 -SkipDependencies -CertificateThumbprint $env:CERTIFICATE_THUMBPRINT
      - name: Verify optional signature
        if: steps.certificate.outputs.thumbprint != ''
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          foreach ($path in @('dist/Manticore.exe', "dist/installer/Manticore-Setup-$version.exe")) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            Write-Host "$path - Authenticode status: $($signature.Status); $($signature.StatusMessage)"
          }
          .venv-desktop/Scripts/python.exe desktop/release_tools.py --verify-signatures
          if ($LASTEXITCODE -ne 0) { throw 'Publisher pin or WinVerifyTrust verification failed' }
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/installer/Manticore-Setup-*.exe
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installer/*
          if-no-files-found: error
      - name: Stage and verify release, then publish to its channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          GH_REPO: UnicornisIT/manticore
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Set-StrictMode -Version Latest
          $tag = $env:RELEASE_TAG
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GH_REPO -cne 'UnicornisIT/manticore' -or $tag -cne "v$version") { throw 'Repository or VERSION/tag mismatch' }
          $installerName = "Manticore-Setup-$version.exe"
          $required = @($installerName, 'desktop-update.json', 'SHA256SUMS.txt')
          Write-Host "Release tag: $tag; Required assets: $($required -join ', ')"
          foreach ($name in $required) {
            if (-not (Test-Path -LiteralPath "dist/installer/$name" -PathType Leaf)) { throw "Missing local asset: $name" }
          }
          $metadata = Get-Content dist/installer/desktop-update.json -Raw | ConvertFrom-Json
          $localSize = (Get-Item -LiteralPath "dist/installer/$installerName").Length
          $localHash = (Get-FileHash -LiteralPath "dist/installer/$installerName" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($metadata.schema_version -ne 1 -or $metadata.repository -cne $env:GH_REPO -or $metadata.version -cne $version -or $metadata.tag -cne $tag -or $metadata.asset -cne $installerName) { throw 'Local desktop-update.json does not describe this release' }
          if ($localSize -le 0 -or $localSize -gt 256MB -or $metadata.size -ne $localSize -or $metadata.sha256 -cne $localHash) { throw 'Local installer size or SHA256 does not match metadata/updater limits' }
          if ((Get-Content dist/installer/SHA256SUMS.txt -Raw).TrimEnd("`r", "`n") -cne "$localHash  $installerName") { throw 'Local SHA256SUMS.txt does not match installer' }
          Write-Host "Installer size: $localSize; Expected SHA256: $localHash"
          # A fresh directory prevents a failed download from reusing files from an earlier run.
          $verificationDirectory = Join-Path $env:RUNNER_TEMP ("manticore-release-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $verificationDirectory | Out-Null
          $lookupError = Join-Path $verificationDirectory 'lookup-error.txt'
          function Assert-Draft($release, $expectedId = 0) {
            if ($release.tagName -cne $tag -or $release.isDraft -ne $true -or $release.databaseId -le 0) { throw 'Expected the current tag to remain a draft with a valid release ID; refusing to modify a published or different release' }
            if ($expectedId -and $release.databaseId -ne $expectedId) { throw 'Release ID changed during verification' }
          }
          function Read-Draft($expectedId = 0) {
            $raw = gh release view $tag --repo $env:GH_REPO --json databaseId,assets,isDraft,tagName
            if ($LASTEXITCODE -ne 0) { throw 'Could not read release draft' }
            $release = $raw | ConvertFrom-Json
            Assert-Draft $release $expectedId
            return $release
          }
          $existing = gh release view $tag --repo $env:GH_REPO --json databaseId,assets,isDraft,tagName 2>$lookupError
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            Assert-Draft $release
            Write-Host 'Release draft found: yes (reusing)'
          } else {
            if ((Get-Content -LiteralPath $lookupError -Raw).Trim() -cne 'release not found') { throw 'Release lookup failed (authentication, permissions, network or API error); draft creation stopped' }
            Write-Host 'Release draft found: no'
            gh release create $tag --repo $env:GH_REPO --draft --verify-tag --generate-notes --title $tag
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release draft' }
            $release = Read-Draft
          }
          $releaseId = $release.databaseId
          Write-Host "Release ID: $releaseId"
          # Recheck immediately before replacing only the three named assets of this draft.
          $release = Read-Draft $releaseId
          gh release upload $tag --repo $env:GH_REPO "dist/installer/$installerName" dist/installer/desktop-update.json dist/installer/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          $release = Read-Draft $releaseId
          Write-Host "Uploaded assets: $(@($release.assets.name) -join ', ')"
          if (@($release.assets | Where-Object { $_.name -like '*.exe' }).Count -ne 1) { throw 'Draft must contain exactly one installer EXE' }
          foreach ($name in $required) {
            $asset = @($release.assets | Where-Object { $_.name -ceq $name })
            if ($asset.Count -ne 1) { throw "Expected exactly one uploaded asset: $name" }
            if ($asset[0].size -ne (Get-Item -LiteralPath "dist/installer/$name").Length) { throw "Uploaded asset size mismatch: $name" }
          }
          # downloadCount changes during our own verification; compare asset identity/content only.
          $assetSnapshot = $release.assets | Sort-Object name | Select-Object id,name,size,digest | ConvertTo-Json -Depth 10 -Compress
          gh release download $tag --repo $env:GH_REPO --dir $verificationDirectory --pattern $installerName --pattern desktop-update.json --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Downloading uploaded release assets failed' }
          foreach ($name in $required) {
            $downloadedPath = Join-Path $verificationDirectory $name
            if (-not (Test-Path -LiteralPath $downloadedPath -PathType Leaf)) { throw "Downloaded asset missing: $name" }
            $downloadedHash = (Get-FileHash -LiteralPath $downloadedPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $expectedHash = (Get-FileHash -LiteralPath "dist/installer/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($name -ceq $installerName) { Write-Host "Downloaded SHA256: $downloadedHash" }
            if ((Get-Item -LiteralPath $downloadedPath).Length -ne (Get-Item -LiteralPath "dist/installer/$name").Length -or $downloadedHash -cne $expectedHash) { throw "Downloaded asset size or SHA256 mismatch: $name" }
          }
          # The client requires the REST asset digest. Read by draft ID, never by tag.
          # Byte verification above is mandatory even if gh's JSON exporter omits digest.
          $raw = gh api "repos/$env:GH_REPO/releases/$releaseId"
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify updater API metadata by release ID' }
          $apiRelease = $raw | ConvertFrom-Json -AsHashtable
          if ($apiRelease.id -ne $releaseId -or $apiRelease.tag_name -cne $tag -or $apiRelease.draft -ne $true) { throw 'Release changed before publication' }
          $apiInstaller = @($apiRelease.assets | Where-Object { $_.name -ceq $installerName })
          if ($apiInstaller.Count -ne 1) { throw 'GitHub API must contain exactly one matching installer' }
          if ($apiInstaller[0].size -ne $localSize) { throw "GitHub API installer size mismatch: expected $localSize, got $($apiInstaller[0].size)" }
          if ($apiInstaller[0].digest -cne "sha256:$localHash") { throw "GitHub API installer digest mismatch: expected sha256:$localHash, got $($apiInstaller[0].digest)" }
          # Draft assets may use GitHub's temporary untagged-* URL until publication.
          # Still require the exact official repository and installer filename.
          $draftUrlPattern = '^https://github\.com/' + [regex]::Escape($env:GH_REPO) + '/releases/download/(?:' + [regex]::Escape($tag) + '|untagged-[0-9a-f]+)/' + [regex]::Escape($installerName) + '$'
          if ($apiInstaller[0].browser_download_url -cnotmatch $draftUrlPattern) { throw 'GitHub API draft installer URL has an unexpected host, repository, tag or filename' }
          Write-Host 'GitHub API installer size, digest and draft URL: PASS'
          $release = Read-Draft $releaseId
          if (($release.assets | Sort-Object name | Select-Object id,name,size,digest | ConvertTo-Json -Depth 10 -Compress) -cne $assetSnapshot) { throw 'Release assets changed during download verification; rerun required' }
          Write-Host 'Draft verification: PASS'
          if ($version.Contains('-')) {
            gh release edit $tag --repo $env:GH_REPO --draft=false --prerelease --latest=false
          } else {
            gh release edit $tag --repo $env:GH_REPO --draft=false --prerelease=false --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing release failed' }
          Write-Host 'Release publish: PASS'
      - name: Remove signing material
        if: always()
        shell: pwsh
        env:
          CERTIFICATE_PATH: ${{ steps.certificate.outputs.pfx_path }}
          CERTIFICATE_THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: |
          if ($env:CERTIFICATE_PATH -and (Test-Path -LiteralPath $env:CERTIFICATE_PATH)) { Remove-Item -LiteralPath $env:CERTIFICATE_PATH -Force }
          if ($env:CERTIFICATE_THUMBPRINT -match '^[0-9A-Fa-f]{40}$') {
            $certificateItem = "Cert:\CurrentUser\My\$env:CERTIFICATE_THUMBPRINT"
            if (Test-Path -LiteralPath $certificateItem) { Remove-Item -LiteralPath $certificateItem -Force }
          }
