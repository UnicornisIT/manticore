name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Поиск секретов (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_<version>_linux_x64.tar.gz from the release checksums file.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Установить gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$archive" gitleaks
          gitleaks version
      - name: Сканировать
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            LOG_OPTS="${BASE_SHA}..${HEAD_SHA}"
          else
            LOG_OPTS="--all"
          fi
          ARGS=()
          if [ -f .gitleaks-baseline.json ]; then
            ARGS+=(--baseline-path .gitleaks-baseline.json)
          fi
          gitleaks git . --log-opts="$LOG_OPTS" --redact --no-banner --exit-code 1 "${ARGS[@]}"

  dependencies:
    name: Уязвимости зависимостей (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Установить pip-audit
        run: python -m pip install --upgrade pip "pip-audit>=2.10,<3"
      # Lock files pin every package with ==, so pip-audit checks them as-is
      # without resolving: the desktop set contains Windows-only packages.
      - name: Аудит requirements-prod.lock
        run: pip-audit -r requirements-prod.lock --no-deps --disable-pip --progress-spinner off
      - name: Аудит requirements-desktop.lock
        run: pip-audit -r requirements-desktop.lock --no-deps --disable-pip --progress-spinner off
