name: pip-audit

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install audit tool
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit server dependencies
        run: pip-audit -r requirements-prod.lock

      - name: Audit desktop dependencies
        run: pip-audit -r requirements-desktop.lock
