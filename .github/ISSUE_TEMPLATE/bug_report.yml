name: Сообщение об ошибке
description: Что-то работает не так, как описано в документации.
title: "[Ошибка]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Не прикладывайте реальные ФИО, email, базы, выгрузки и пароли — только
        синтетические данные. Об уязвимостях сообщайте приватно по
        [политике безопасности](https://github.com/UnicornisIT/manticore/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Что произошло
      description: Кратко опишите проблему.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Открыть …
        2. Загрузить файл …
        3. Нажать …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия Manticore
      description: Из файла `VERSION` или окна «О программе».
      placeholder: "0.1.3"
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Вариант запуска
      options:
        - Windows Desktop
        - Сервер Linux
        - Локальный запуск из исходников
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Окружение
      placeholder: "Windows 11, Python 3.11.9"
  - type: textarea
    id: logs
    attributes:
      label: Журнал или снимок экрана
      description: Удалите из журнала персональные данные перед отправкой.
      render: text
