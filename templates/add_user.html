{% extends "base.html" %}
{% block title %}Добавить пользователя{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/add_user.css') }}">
{% endblock %}
{% block content %}
<div class="user-form-page">
    <h2 class="user-form-title">Добавить пользователя</h2>
    <form method="post" class="user-form-card">
        {% include "_csrf_field.html" %}
        <div class="user-form-fields">
            <div class="user-form-field">
                <label for="username">Логин</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div class="user-form-field">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
                <p class="user-form-help">Минимум 8 символов. Пароль будет сохранен как хеш.</p>
            </div>
            <div class="user-form-field">
                <label for="fio">ФИО</label>
                <input type="text" id="fio" name="fio" required autocomplete="name">
            </div>
            <div class="user-form-field">
                <label for="position">Должность</label>
                <input type="text" id="position" name="position" required>
            </div>
            <div class="user-form-field">
                <label for="role">Роль</label>
                <select id="role" name="role">
                    {% for role, label in role_labels.items() %}
                    <option value="{{ role }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="user-form-actions">
                <button type="submit" class="btn">Добавить</button>
                <a href="{{ url_for('admin_panel') }}" class="btn btn-danger">Отмена</a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
