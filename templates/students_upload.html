<!-- templates/students_upload.html -->
{% extends "base.html" %}
{% block title %}Загрузка студентов{% endblock %}
{% block content %}
<h2>Загрузка студентов</h2>
<form method="post" enctype="multipart/form-data">
    {% include "_csrf_field.html" %}
    <span class="file-picker" data-file-dropzone tabindex="0" role="button" aria-label="Выберите или перетащите файл студентов">
        <input type="file" name="file" id="students_upload_file" accept=".xlsx,.xls,.csv" required data-file-name-target="students_upload_file_name">
        <label for="students_upload_file" class="file-picker-button">Выберите файл</label>
        <span class="file-picker-drop-text">или перетащите сюда Excel/CSV</span>
        <span id="students_upload_file_name" class="file-picker-name">Файл не выбран</span>
    </span>
    <button type="submit" class="btn btn-success">Загрузить</button>
</form>
{% if message %}
    <div class="alert alert-info">{{ message }}</div>
{% endif %}
<a href="{{ url_for('students_list') }}" class="btn btn-secondary">Назад к списку</a>
{% endblock %}
