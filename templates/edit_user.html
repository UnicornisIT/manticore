{% extends "base.html" %}
{% block title %}Редактирование пользователя{% endblock %}
{% block head %}
<style>
    .user-form-page {
        max-width: 560px;
        margin: 0 auto;
    }
    .user-form-title {
        margin: 18px 0 24px 0;
        color: #2d3a4b;
        font-size: 28px;
        text-align: center;
    }
    .user-form-card {
        max-width: 460px;
        margin: 0 auto 36px auto;
        padding: 28px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 18px 42px rgba(15, 23, 42, 0.08);
    }
    .user-form-fields {
        display: grid;
        gap: 16px;
    }
    .user-form-field label {
        display: block;
        margin-bottom: 7px;
        color: #1f2937;
        font-size: 14px;
        font-weight: 700;
    }
    .user-form-field input,
    .user-form-field select {
        box-sizing: border-box;
        width: 100%;
        min-height: 42px;
        padding: 9px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #fff;
        color: #111827;
        font: inherit;
        font-size: 15px;
        transition: border-color 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
    }
    .user-form-field select {
        cursor: pointer;
    }
    .user-form-field input:focus,
    .user-form-field select:focus {
        outline: 0;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.14);
        background: #f8fbff;
    }
    .user-form-help {
        margin: 7px 0 0 0;
        color: #64748b;
        font-size: 13px;
        line-height: 1.35;
    }
    .user-form-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 6px;
    }
    .user-form-actions .btn {
        width: 100%;
    }
    @media (max-width: 560px) {
        .user-form-card {
            padding: 20px;
        }
        .user-form-actions {
            grid-template-columns: 1fr;
        }
    }
</style>
{% endblock %}
{% block content %}
<div class="user-form-page">
    <h2 class="user-form-title">Редактирование пользователя</h2>
    <form method="post" class="user-form-card">
        {% include "_csrf_field.html" %}
        <div class="user-form-fields">
            <div class="user-form-field">
                <label for="username">Логин</label>
                <input type="text" id="username" name="username" value="{{ user[1] }}" required autocomplete="username">
            </div>
            <div class="user-form-field">
                <label for="password">Новый пароль</label>
                <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" placeholder="Оставьте пустым, чтобы не менять">
                <p class="user-form-help">Текущий пароль не отображается. При необходимости задайте новый пароль.</p>
            </div>
            <div class="user-form-field">
                <label for="role">Роль</label>
                <select id="role" name="role">
                    {% for role, label in role_labels.items() %}
                    <option value="{{ role }}" {% if user[2] == role %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="user-form-field">
                <label for="approved">Статус</label>
                <select id="approved" name="approved">
                    <option value="1" {% if user[3] == 1 %}selected{% endif %}>Одобрен</option>
                    <option value="0" {% if user[3] == 0 %}selected{% endif %}>Ожидает</option>
                </select>
            </div>
            <div class="user-form-actions">
                <button type="submit" class="btn">Сохранить</button>
                <a href="{{ url_for('admin_panel') }}" class="btn btn-danger">Отмена</a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
