<!-- templates/register.html -->
{% extends "base.html" %}
{% block title %}Регистрация ассистента{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/register.css') }}">
{% endblock %}
{% block content %}
<h1 class="register-title">Регистрация ассистента</h1>
<form method="post" class="register-form">
    {% include "_csrf_field.html" %}
    <label for="username">Логин:</label>
    <input type="text" id="username" name="username" required>
    <label for="password">Пароль:</label>
    <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
    <div class="register-help">Минимум 8 символов.</div>
    <button type="submit" class="btn">Зарегистрироваться</button>
    <a href="{{ url_for('login') }}" class="btn btn-secondary">Вернуться к входу</a>
</form>
{% endblock %}
